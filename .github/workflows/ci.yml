name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML
        run: npx --yes html-validate@9 index.html
      - name: Check local files exist
        run: node scripts/check-assets.mjs
